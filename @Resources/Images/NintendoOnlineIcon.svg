<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Solid Red Circular Badge -->
  <circle cx="50" cy="50" r="46" fill="#E60012" />

  <!-- Left Joy-Con (Outlined White) -->
  <path 
    d="M 45.5 26 H 39 A 8 8 0 0 0 31 34 V 50 A 8 8 0 0 0 39 58 H 45.5 Z" 
    stroke="#FFFFFF" 
    stroke-width="3.2" 
    stroke-linejoin="round" 
  />
  <!-- Left Analog Stick -->
  <circle cx="38.5" cy="36.5" r="3.2" fill="#FFFFFF" />

  <!-- Right Joy-Con (Solid White with Cutout Stick) -->
  <path 
    fill-rule="evenodd" 
    clip-rule="evenodd" 
    d="M 52 24.4 H 59.5 A 9.6 9.6 0 0 1 69.1 34 V 50 A 9.6 9.6 0 0 1 59.5 59.6 H 52 Z M 60.5 47.7 A 3.2 3.2 0 1 0 60.5 41.3 A 3.2 3.2 0 1 0 60.5 47.7 Z" 
    fill="#FFFFFF" 
  />

  <!-- "ONLINE" Wordmark -->
  <text 
    x="50" 
    y="74.5" 
    fill="#FFFFFF" 
    font-family="Arial, Helvetica, sans-serif" 
    font-weight="800" 
    font-size="12.5" 
    letter-spacing="0.8" 
    text-anchor="middle"
  >ONLINE</text>
</svg>
