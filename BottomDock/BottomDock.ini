[Rainmeter]
Update=1000
AccurateText=1
DefaultDraggable=0
OnRefreshAction=[!Draggable 0]

[Variables]
; Safe default opens Windows power settings. Change only if you intentionally want
; this button to run a different power action.
PowerAction=["ms-settings:powersleep"]
DockWidth=1110
DockHeight=118
DockRadius=59
GameChatColor=227,146,48,255

[MeterPill]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#DockWidth#,#DockHeight#,#DockRadius# | Fill Color 248,248,248,245 | StrokeWidth 0

[MeterNintendoOnlineIcon]
Meter=Image
X=21
Y=15
ImageName=#@#Images\NintendoOnlineIcon.png
W=90
H=90
PreserveAspectRatio=1
LeftMouseUpAction=["C:\Program Files (x86)\Steam\steam.exe"]
ToolTipText=Launch Steam

[MeterGameChat]
Meter=Shape
X=147
Y=36
Shape=Rectangle 2,2,42,42,3 | Fill Color 0,0,0,0 | StrokeWidth 4 | Stroke Color #GameChatColor#
ToolTipText=GameChat

[MeterGameChatLetter]
Meter=String
X=170
Y=59
W=46
H=46
FontFace=Segoe UI
FontSize=24
FontColor=#GameChatColor#
FontWeight=600
StringAlign=CenterCenter
Text=C
AntiAlias=1
ToolTipText=GameChat

[MeterNewsIcon]
Meter=Image
X=253
Y=30
ImageName=#@#Images\NewsIcon.png
W=58
H=58
PreserveAspectRatio=1
ToolTipText=News

[MeterShopIcon]
