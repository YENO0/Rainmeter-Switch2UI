[Rainmeter]
Update=1000
AccurateText=1
DefaultDraggable=0
OnRefreshAction=[!Draggable 0][!SetWindowPosition "20" "20B" "0" "100%"]

[MeterKeyboardIcon]
Meter=Image
X=0
Y=0
ImageName=#@#Images\KeyboardIcon.png
W=120
H=43
PreserveAspectRatio=1
LeftMouseUpAction=["osk.exe"]
ToolTipText=Open On-Screen Keyboard
