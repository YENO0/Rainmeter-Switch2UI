[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultDraggable=0
OnRefreshAction=[!Draggable 0]

[MeasureTime]
Measure=Time
Format=%#I:%M %p

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[MeasureWiFi]
Measure=WiFiStatus
WiFiInfoType=Quality

; --- 1. CLOCK ---
[MeterTime]
Meter=String
MeasureName=MeasureTime
X=0
Y=0
FontFace=Segoe UI
FontSize=28
FontColor=45,45,45,255
FontWeight=600
AntiAlias=1

; --- 2. WIFI ICON ---
[MeterWiFiIcon]
Meter=Shape
X=16R
Y=([MeterTime:Y]+([MeterTime:H]-28)/2)
; Three nested arches with rounded ends
Shape=Path OuterWave | StrokeWidth 3.2 | Stroke Color 45,45,45,255 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0
OuterWave=0,7 | CurveTo 34,7, 17,-3
Shape2=Path MidWave | StrokeWidth 3.2 | Stroke Color 45,45,45,255 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0
MidWave=5,13 | CurveTo 29,13, 17,5.94
Shape3=Path InnerWave | StrokeWidth 3.2 | Stroke Color 45,45,45,255 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0
InnerWave=11,19 | CurveTo 23,19, 17,15.47
; Centered signal dot
Shape4=Ellipse 17,25,2.5 | Fill Color 45,45,45,255 | StrokeWidth 0
LeftMouseUpAction=["ms-settings:network-wifi"]
ToolTipText=Wi-Fi Signal: [MeasureWiFi]% (Click for Wi-Fi Settings)
DynamicVariables=1

; --- 3. BATTERY PERCENTAGE ---
[MeterBatteryText]
Meter=String
MeasureName=MeasureBattery
X=16R
Y=0
FontFace=Segoe UI
FontSize=28
FontColor=45,45,45,255
FontWeight=600
Text=%1%
AntiAlias=1

; --- 4. DYNAMIC BATTERY ICON ---
[MeterBatteryIcon]
Meter=Shape
X=16R
Y=([MeterBatteryText:Y]+([MeterBatteryText:H]-22)/2)
W=50
H=28
; Outer battery border
Shape=Rectangle 0,0,42,22,3 | Fill Color 0,0,0,0 | StrokeWidth 2.2 | Stroke Color 45,45,45,255
; Positive battery terminal nub on the right
Shape2=Rectangle 43,6,4,10,1 | Fill Color 45,45,45,255 | StrokeWidth 0
; Dynamic inner fill bar (scales automatically with your real battery %)
Shape3=Rectangle 3,3,(36 * ([MeasureBattery] / 100)),16,1 | Fill Color 45,45,45,255 | StrokeWidth 0
DynamicVariables=1
