[Rainmeter]
Update=1000
AccurateText=1
DefaultDraggable=0
OnRefreshAction=[!Draggable 0]

[Variables]
; Local image overrides use ignored files in @Resources. Clear them before publishing.
AvatarImage=#@#avatar.png
AvatarImage2=#@#avatar2.png

; Outer subtle ring
[MeterRing]
Meter=Shape
X=0
Y=0
Shape=Ellipse 34,34,34 | Fill Color 255,255,255,255 | StrokeWidth 2 | Stroke Color 210,210,210,255
LeftMouseUpAction=["explorer.exe" shell:Profile]
ToolTipText=Open User Profile Folder

; Fallback colored circle if avatar.png is not added yet
[MeterFallbackBg]
Meter=Shape
X=4
Y=4
Shape=Ellipse 30,30,30 | Fill Color 77,112,145,255 | StrokeWidth 0

; Your custom circular avatar (auto-masks any square image into a circle!)
[MeterAvatarMask]
Meter=Shape
X=4
Y=4
Shape=Ellipse 30,30,30 | Fill Color 255,255,255,255

[MeterAvatar]
Meter=Image
ImageName=#AvatarImage#
X=0
Y=0
W=60
H=60
PreserveAspectRatio=2
Container=MeterAvatarMask

; Second account avatar shown beside the primary account.
[MeterRing2]
Meter=Shape
X=96
Y=0
Shape=Ellipse 34,34,34 | Fill Color 255,255,255,255 | StrokeWidth 2 | Stroke Color 210,210,210,255
ToolTipText=Second Profile

[MeterFallbackBg2]
Meter=Shape
X=100
Y=4
Shape=Ellipse 30,30,30 | Fill Color 11,134,209,255 | StrokeWidth 0

[MeterAvatarMask2]
Meter=Shape
X=100
Y=4
Shape=Ellipse 30,30,30 | Fill Color 255,255,255,255

[MeterAvatar2]
Meter=Image
ImageName=#AvatarImage2#
X=0
Y=0
W=60
H=60
PreserveAspectRatio=2
Container=MeterAvatarMask2
