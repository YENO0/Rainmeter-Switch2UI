[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
DefaultDraggable=0
OnRefreshAction=[!Draggable 0]

[Variables]
; --- OPTIONAL LOCAL APP SETTINGS ---
; Set App1Path-App4Path to an executable path or launch URI for each local app.
; Local image overrides below use ignored files in @Resources. Clear them before publishing.
; Tiles 5-6 are original sample artwork and do not launch an app.
App1Name=Sample App 1
App1Path=
App1Img=#@#game1-rounded.png

App2Name=Sample App 2
App2Path=
App2Img=#@#game2-rounded.png

App3Name=Sample App 3
App3Path=
App3Img=#@#game3-rounded.png

App4Name=Sample App 4
App4Path=
App4Img=#@#game4-rounded.png

; Sample carousel tiles. They have no launch actions.
App5Name=Sample App 5
App6Name=Sample App 6

; --- SHARED STYLING & GAPS ---
TileWidth=352
TileHeight=344
Gap=14
TileTop=50
CoverInset=7
CoverWidth=338
CoverHeight=330
TileRadius=22
MaskRadius=17
; The viewport leaves room for half a tile before the first item.
CarouselInset=190
ViewportWidth=1830
ViewportHeight=400
BorderDefault=Rectangle 0,0,#TileWidth#,#TileHeight#,#TileRadius# | Fill Color 255,255,255,0 | StrokeWidth 3 | Stroke Color 215,215,215,255
BorderSelected=Rectangle 0,0,#TileWidth#,#TileHeight#,#TileRadius# | Fill Color 255,255,255,0 | StrokeWidth 6 | Stroke Color 11,185,230,255
Selected=1
NextIndex=2
PreviousIndex=6
CarouselOffset=0
GameCardColor=10,102,214,255

; --- SELECTION STATE ACTIONS ---
Select1=[!SetVariable Selected 1][!SetVariable NextIndex 2][!SetVariable PreviousIndex 6][!SetVariable CarouselOffset 0][!ShowMeterGroup Title1][!HideMeterGroup Title2][!HideMeterGroup Title3][!HideMeterGroup Title4][!HideMeterGroup Title5][!HideMeterGroup Title6][!SetOption Border1 Shape "#BorderSelected#"][!SetOption Border2 Shape "#BorderDefault#"][!SetOption Border3 Shape "#BorderDefault#"][!SetOption Border4 Shape "#BorderDefault#"][!SetOption Border5 Shape "#BorderDefault#"][!SetOption Border6 Shape "#BorderDefault#"][!UpdateMeter *][!Redraw]
Select2=[!SetVariable Selected 2][!SetVariable NextIndex 3][!SetVariable PreviousIndex 1][!SetVariable CarouselOffset 0][!HideMeterGroup Title1][!ShowMeterGroup Title2][!HideMeterGroup Title3][!HideMeterGroup Title4][!HideMeterGroup Title5][!HideMeterGroup Title6][!SetOption Border1 Shape "#BorderDefault#"][!SetOption Border2 Shape "#BorderSelected#"][!SetOption Border3 Shape "#BorderDefault#"][!SetOption Border4 Shape "#BorderDefault#"][!SetOption Border5 Shape "#BorderDefault#"][!SetOption Border6 Shape "#BorderDefault#"][!UpdateMeter *][!Redraw]
Select3=[!SetVariable Selected 3][!SetVariable NextIndex 4][!SetVariable PreviousIndex 2][!SetVariable CarouselOffset 0][!HideMeterGroup Title1][!HideMeterGroup Title2][!ShowMeterGroup Title3][!HideMeterGroup Title4][!HideMeterGroup Title5][!HideMeterGroup Title6][!SetOption Border1 Shape "#BorderDefault#"][!SetOption Border2 Shape "#BorderDefault#"][!SetOption Border3 Shape "#BorderSelected#"][!SetOption Border4 Shape "#BorderDefault#"][!SetOption Border5 Shape "#BorderDefault#"][!SetOption Border6 Shape "#BorderDefault#"][!UpdateMeter *][!Redraw]
Select4=[!SetVariable Selected 4][!SetVariable NextIndex 5][!SetVariable PreviousIndex 3][!SetVariable CarouselOffset 0][!HideMeterGroup Title1][!HideMeterGroup Title2][!HideMeterGroup Title3][!ShowMeterGroup Title4][!HideMeterGroup Title5][!HideMeterGroup Title6][!SetOption Border1 Shape "#BorderDefault#"][!SetOption Border2 Shape "#BorderDefault#"][!SetOption Border3 Shape "#BorderDefault#"][!SetOption Border4 Shape "#BorderSelected#"][!SetOption Border5 Shape "#BorderDefault#"][!SetOption Border6 Shape "#BorderDefault#"][!UpdateMeter *][!Redraw]
Select5=[!SetVariable Selected 5][!SetVariable NextIndex 6][!SetVariable PreviousIndex 4][!SetVariable CarouselOffset "(#TileWidth#+#Gap#)"][!HideMeterGroup Title1][!HideMeterGroup Title2][!HideMeterGroup Title3][!HideMeterGroup Title4][!ShowMeterGroup Title5][!HideMeterGroup Title6][!SetOption Border1 Shape "#BorderDefault#"][!SetOption Border2 Shape "#BorderDefault#"][!SetOption Border3 Shape "#BorderDefault#"][!SetOption Border4 Shape "#BorderDefault#"][!SetOption Border5 Shape "#BorderSelected#"][!SetOption Border6 Shape "#BorderDefault#"][!UpdateMeter *][!Redraw]
Select6=[!SetVariable Selected 6][!SetVariable NextIndex 1][!SetVariable PreviousIndex 5][!SetVariable CarouselOffset "((#TileWidth#+#Gap#)*2)"][!HideMeterGroup Title1][!HideMeterGroup Title2][!HideMeterGroup Title3][!HideMeterGroup Title4][!HideMeterGroup Title5][!ShowMeterGroup Title6][!SetOption Border1 Shape "#BorderDefault#"][!SetOption Border2 Shape "#BorderDefault#"][!SetOption Border3 Shape "#BorderDefault#"][!SetOption Border4 Shape "#BorderDefault#"][!SetOption Border5 Shape "#BorderDefault#"][!SetOption Border6 Shape "#BorderSelected#"][!UpdateMeter *][!Redraw]

; Mouse wheel changes the focused app and scrolls after the fourth tile.
[MeasureSelected]
Measure=Calc
Formula=#Selected#
DynamicVariables=1
IfCondition=MeasureSelected = 1
IfTrueAction=#Select1#
IfCondition2=MeasureSelected = 2
IfTrueAction2=#Select2#
IfCondition3=MeasureSelected = 3
IfTrueAction3=#Select3#
IfCondition4=MeasureSelected = 4
IfTrueAction4=#Select4#
IfCondition5=MeasureSelected = 5
IfTrueAction5=#Select5#
IfCondition6=MeasureSelected = 6
IfTrueAction6=#Select6#

; Shared clipping area keeps off-screen tiles out of the skin window.
[Viewport]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#ViewportWidth#,#ViewportHeight# | Fill Color 255,255,255,255 | StrokeWidth 0
W=#ViewportWidth#
H=#ViewportHeight#

; ================= TILE 1 (Selected by Default) =================
[TileGlyph1]
Meter=Shape
Group=Title1
X=(#CarouselInset# + 15 - #CarouselOffset#)
Y=6
Shape=Rectangle 0,0,23.33,28,2 | Fill Color #GameCardColor# | StrokeWidth 0
Shape2=Path CardCutout | Fill Color 255,255,255,255 | StrokeWidth 0
CardCutout=6.6,20.2 | LineTo 16.7,20.2 | LineTo 11.7,24.1 | ClosePath 1
Container=Viewport
DynamicVariables=1

[TitleText1]
Meter=String
Group=Title1
X=(#CarouselInset# + 50 - #CarouselOffset#)
Y=0
FontFace=Segoe UI
FontSize=20
FontColor=11,134,209,255
FontWeight=600
Text=#App1Name#
AntiAlias=1
Container=Viewport
DynamicVariables=1

[FallbackArt1]
Meter=Shape
X=(#CarouselInset# + #CoverInset# + 3 - #CarouselOffset#)
Y=(#TileTop# + #CoverInset#)
Shape=Rectangle 0,0,#CoverWidth#,#CoverHeight#,#MaskRadius# | Fill Color 18,62,116,255 | StrokeWidth 0
Shape2=Ellipse 249,89,81 | Fill Color 27,148,205,255 | StrokeWidth 0
Shape3=Ellipse 86,119,28 | Fill Color 248,204,67,255 | StrokeWidth 0
Shape4=Rectangle 28,172,252,7,3 | Fill Color 93,204,226,255 | StrokeWidth 0
Container=Viewport
LeftMouseUpAction=#Select1#
LeftMouseDoubleClickAction=["#App1Path#"]
MouseScrollUpAction=[!SetVariable Selected #PreviousIndex#][!UpdateMeasure MeasureSelected]
MouseScrollDownAction=[!SetVariable Selected #NextIndex#][!UpdateMeasure MeasureSelected]
DynamicVariables=1

[Cover1]
Meter=Image
ImageName=#App1Img#
X=(#CarouselInset# + #CoverInset# + 3 - #CarouselOffset#)
Y=(#TileTop# + #CoverInset#)
W=#CoverWidth#
H=#CoverHeight#
PreserveAspectRatio=2
Container=Viewport
LeftMouseUpAction=#Select1#
LeftMouseDoubleClickAction=["#App1Path#"]
MouseScrollUpAction=[!SetVariable Selected #PreviousIndex#][!UpdateMeasure MeasureSelected]
MouseScrollDownAction=[!SetVariable Selected #NextIndex#][!UpdateMeasure MeasureSelected]
DynamicVariables=1

