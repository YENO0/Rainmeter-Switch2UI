ImageName=#App2Img#
X=(#CarouselInset# + #TileWidth# + #Gap# + #CoverInset# - #CarouselOffset#)
Y=(#TileTop# + #CoverInset#)
W=#CoverWidth#
H=#CoverHeight#
PreserveAspectRatio=2
Container=Viewport
